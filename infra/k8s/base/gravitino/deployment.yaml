apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitino
  namespace: gravitino
  labels:
    app: gravitino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitino
  template:
    metadata:
      labels:
        app: gravitino
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.postgres.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z minio.minio.svc.cluster.local 9000; do echo waiting for minio; sleep 2; done;']
      containers:
        - name: gravitino
          image: apache/gravitino:1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              mkdir -p /opt/gravitino/libs /opt/gravitino/catalogs/lakehouse-iceberg/libs /opt/gravitino/iceberg-rest-server/libs
              find /opt/gravitino/jdbc-drivers -name 'postgresql-*.jar' -exec ln -sfv {} /opt/gravitino/libs/ \;
              find /opt/gravitino/iceberg-bundles -name '*.jar' -exec ln -sfv {} /opt/gravitino/catalogs/lakehouse-iceberg/libs/ \; -exec ln -sfv {} /opt/gravitino/iceberg-rest-server/libs/ \;
              export JAVA_OPTS="-XX:+UseContainerSupport -Xms256m -Xmx768m -Daws.region=us-east-1"
              export AWS_REGION="us-east-1"
              ./bin/gravitino.sh run || { echo "GRAVITINO FAILED TO START:"; cat /opt/gravitino/logs/* 2>/dev/null; sleep 300; }
          ports:
            - containerPort: 8090
              name: web-rest
            - containerPort: 9001
              name: iceberg-rest
          volumeMounts:
            - name: config
              mountPath: /opt/gravitino/conf/gravitino.conf
              subPath: gravitino.conf
          readinessProbe:
            httpGet:
              path: /api/version
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: 8090
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: config
          configMap:
            name: gravitino-config
