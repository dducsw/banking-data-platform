apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-buckets
  namespace: minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z minio 9000; do echo waiting for minio; sleep 2; done;']
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-03-07T00-31-49Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
              mc mb --ignore-existing local/lakehouse
              mc mb --ignore-existing local/checkpoints
              mc mb --ignore-existing local/spark-logs
              mc anonymous set download local/lakehouse
              echo "MinIO buckets initialized successfully."
