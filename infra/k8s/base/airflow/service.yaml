apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: webserver
    app.kubernetes.io/part-of: data-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: webserver
  ports:
    - name: http
      port: 8088
      targetPort: 8088
