apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: init
    app.kubernetes.io/part-of: data-platform
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.postgres.svc.cluster.local 5432; do echo "Waiting for postgres..."; sleep 2; done;']
      containers:
        - name: airflow-init
          image: apache/airflow:3.1.3-python3.10
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              echo "=== Initializing Airflow 3 Metadata Database ==="
              airflow db migrate
              echo "=== Airflow 3 DB Initialization Completed Successfully ==="
          envFrom:
            - configMapRef:
                name: airflow-config
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: sql-alchemy-conn
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: fernet-key
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: webserver-secret-key
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: admin-password
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
