apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: debezium
  labels:
    app: debezium-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka.kafka.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done;']
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.postgres.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
        - name: debezium-connect
          image: quay.io/debezium/connect:3.2.0.Final
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "debezium-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium_configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium_offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium_statuses"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-Xmx512m -Xms256m"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m -Xms256m"
          ports:
            - containerPort: 8083
              name: rest-api
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
