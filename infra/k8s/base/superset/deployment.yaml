apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: superset
  labels:
    app: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.postgres.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis.redis.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done;']
      containers:
        - name: superset
          image: apache/superset:3.1.0
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              superset db upgrade && \
              superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password $SUPERSET_ADMIN_PASSWORD || true && \
              superset init && \
              /usr/bin/run-server.sh
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-secrets
                  key: secret-key
            - name: SQLALCHEMY_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: superset-secrets
                  key: sqlalchemy-uri
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-secrets
                  key: admin-password
          ports:
            - containerPort: 8088
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
