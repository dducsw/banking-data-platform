apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-defaults
  namespace: spark
data:
  spark-defaults.conf: |
    # S3A & MinIO Settings
    spark.hadoop.fs.s3a.endpoint http://minio.minio.svc.cluster.local:9000
    spark.hadoop.fs.s3a.access.key admin
    spark.hadoop.fs.s3a.secret.key password123
    spark.hadoop.fs.s3a.path.style.access true
    spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled false
    spark.hadoop.fs.s3a.threads.keepalivetime 60
    spark.hadoop.fs.s3a.connection.timeout 60000
    spark.hadoop.fs.s3a.connection.establish.timeout 30000
    spark.hadoop.fs.s3a.connection.acquisition.timeout 30000
    spark.hadoop.fs.s3a.connection.request.timeout 30000
    spark.hadoop.fs.s3a.socket.timeout 60000
    spark.hadoop.fs.s3a.multipart.purge.age 86400
    spark.hadoop.fs.s3a.multipart.size 104857600
    spark.hadoop.fs.s3a.multipart.threshold 2147483647
    spark.hadoop.fs.s3a.fast.upload.buffer disk
    spark.hadoop.fs.s3a.fast.upload true
    spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

    # Iceberg REST Catalog Settings (Apache Gravitino 1.3.0)
    spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.lakehouse org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lakehouse.type rest
    spark.sql.catalog.lakehouse.uri http://gravitino.gravitino.svc.cluster.local:9001/iceberg/
    spark.sql.catalog.lakehouse.io-impl org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.lakehouse.s3.endpoint http://minio.minio.svc.cluster.local:9000
    spark.sql.catalog.lakehouse.s3.access-key-id admin
    spark.sql.catalog.lakehouse.s3.secret-access-key password123
    spark.sql.catalog.lakehouse.s3.path-style-access true
    spark.sql.catalog.lakehouse.client.region us-east-1
    spark.sql.defaultCatalog lakehouse

    # Resource Constraints for 16GB RAM Local Environment
    spark.driver.memory 512m
    spark.driver.cores 1
    spark.executor.memory 1g
    spark.executor.cores 1
    spark.executor.instances 1
