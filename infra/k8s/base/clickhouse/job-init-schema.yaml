apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init-schema
  namespace: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: init
    app.kubernetes.io/part-of: data-platform
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z clickhouse.clickhouse.svc.cluster.local 8123; do echo "Waiting for ClickHouse..."; sleep 2; done;']
      containers:
        - name: init-schema
          image: clickhouse/clickhouse-server:25.1
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              echo "=== Initializing Banking Analytics Tables in ClickHouse 25.1 ==="
              
              clickhouse-client --host clickhouse.clickhouse.svc.cluster.local --port 9000 --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --multiquery << 'EOF'
              CREATE DATABASE IF NOT EXISTS analytics;

              -- Realtime Transactions OLAP Table
              CREATE TABLE IF NOT EXISTS analytics.realtime_transactions (
                  transaction_id String,
                  account_id String,
                  customer_id String,
                  transaction_type LowCardinality(String),
                  amount Decimal(18, 2),
                  currency LowCardinality(String),
                  channel LowCardinality(String),
                  branch_id String,
                  status LowCardinality(String),
                  transaction_time DateTime64(3, 'UTC'),
                  created_date Date MATERIALIZED toDate(transaction_time)
              ) ENGINE = MergeTree()
              PARTITION BY toYYYYMM(created_date)
              ORDER BY (account_id, transaction_time, transaction_id)
              SETTINGS index_granularity = 8192;

              -- Daily Account Balance Snapshot Mart
              CREATE TABLE IF NOT EXISTS analytics.daily_account_balances (
                  snapshot_date Date,
                  account_id String,
                  customer_id String,
                  account_type LowCardinality(String),
                  opening_balance Decimal(18, 2),
                  closing_balance Decimal(18, 2),
                  total_inflow Decimal(18, 2),
                  total_outflow Decimal(18, 2),
                  transaction_count UInt32
              ) ENGINE = ReplacingMergeTree()
              PARTITION BY toYYYYMM(snapshot_date)
              ORDER BY (snapshot_date, account_id);

              -- Fraud & Risk Alerts Mart
              CREATE TABLE IF NOT EXISTS analytics.fraud_risk_alerts (
                  alert_id String,
                  transaction_id String,
                  customer_id String,
                  risk_score Float32,
                  rule_triggered LowCardinality(String),
                  severity LowCardinality(String),
                  detected_at DateTime64(3, 'UTC')
              ) ENGINE = MergeTree()
              PARTITION BY toYYYYMM(toDate(detected_at))
              ORDER BY (severity, detected_at, alert_id);

              SHOW TABLES FROM analytics;
              EOF

              echo "=== ClickHouse 25.1 Banking Analytics Tables Created Successfully ==="
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secrets
                  key: admin-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secrets
                  key: admin-password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
