apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─────────────────────────────────────────────────────────────────────────────
# Dev Overlay (Target: k3d local cluster)
# Scope: Storage & Lakehouse Core + Metastore + Spark Compute
# Deploy: kubectl apply -k infra/k8s/overlays/dev
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - ../../base/postgres
  - ../../base/minio
  - ../../base/gravitino
  - ../../base/spark
  - ../../base/trino
  - ../../base/airflow
  - ../../base/clickhouse
  - ../../base/prometheus
  - ../../base/kafka
  - ../../base/debezium

patches:
  # ── Kafka (KRaft Streaming): local-path & dev limits ───────────────────────
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "150m"
            memory: "384Mi"
          limits:
            cpu: "1000m"
            memory: "768Mi"

  # ── Prometheus (Monitoring): local-path & dev limits ───────────────────────
  - target:
      kind: StatefulSet
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
  # ── Postgres: local-path storage & dev limits ──────────────────────────────
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

  # ── MinIO (S3 Lakehouse Storage): local-path & dev limits ───────────────────
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

  # ── Apache Gravitino 1.3.0 (Iceberg REST Catalog): dev limits ─────────────
  - target:
      kind: Deployment
      name: gravitino
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
