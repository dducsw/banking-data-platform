image:
  registry: docker.io
  repository: apache/gravitino
  tag: 1.3.0
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  webHttpPort: 8090
  icebergHttpPort: 9001

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

config:
  gravitino.entity.store: "relational"
  gravitino.entity.store.relational: "JDBCBackend"
  gravitino.entity.store.relational.jdbcUrl: "jdbc:postgresql://postgres.postgres.svc.cluster.local:5432/gravitino"
  gravitino.entity.store.relational.jdbcDriver: "org.postgresql.Driver"
  gravitino.entity.store.relational.jdbcUser: "postgres"
  gravitino.entity.store.relational.jdbcPassword: "postgres123"
  gravitino.auxService.names: "iceberg-rest"
  gravitino.iceberg-rest.host: "0.0.0.0"
  gravitino.iceberg-rest.httpPort: "9001"
  gravitino.iceberg-rest.catalog-backend: "jdbc"
  gravitino.iceberg-rest.jdbc-driver: "org.postgresql.Driver"
  gravitino.iceberg-rest.uri: "jdbc:postgresql://postgres.postgres.svc.cluster.local:5432/gravitino"
  gravitino.iceberg-rest.jdbc-user: "postgres"
  gravitino.iceberg-rest.jdbc-password: "postgres123"
  gravitino.iceberg-rest.jdbc-initialize: "true"
  gravitino.iceberg-rest.warehouse: "s3://lakehouse/"
  gravitino.iceberg-rest.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
  gravitino.iceberg-rest.s3-endpoint: "http://minio.minio.svc.cluster.local:9000"
  gravitino.iceberg-rest.s3-access-key-id: "admin"
  gravitino.iceberg-rest.s3-secret-access-key: "password123"
  gravitino.iceberg-rest.s3-path-style-access: "true"
