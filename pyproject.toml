[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "big-data-platform-for-banking"
version = "0.1.0"
description = "Enterprise Big Data Lakehouse Platform for Banking Transactions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=4.1.0",
    "pyarrow>=15.0.2",
    "pandas>=2.0.3",
    "polars>=0.20.31",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.69",
    "minio>=7.2.5",
    "duckdb>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
